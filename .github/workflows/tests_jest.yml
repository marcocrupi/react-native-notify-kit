name: Jest Tests

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    name: Jest (Node ${{ matrix.node }})
    timeout-minutes: 50
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'
      - name: Yarn Install
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 4
          command: yarn install --immutable
      - name: Build React Native package
        run: yarn build:rn
      - name: Jest
        env:
          # React is installed in the smoke workspace; Jest runs from packages/react-native.
          NODE_PATH: ${{ github.workspace }}/apps/smoke/node_modules
        run: yarn tests_rn:test
      - name: Server SDK
        run: yarn tests_rn:test-server --runInBand
      - name: CLI compatibility
        run: yarn workspace @react-native-notify-kit/cli test --runInBand
      - name: Build orchestration and release networking
        run: yarn test:build-tooling && yarn test:release-network
      - name: CLI artifact isolation
        run: yarn test:cli-artifacts
